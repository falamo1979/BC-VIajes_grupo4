<body>
   <!--form login--> 
<div class="login">    
<form class="card border-0 shadow-sm rounded-4 p-4 p-lg-5 ">
       <div class="text-center mb-4">
           <h4 class="fw-bold mb-2">Bienvenido</h4>
           <p class="text-muted mb-0">
               Acceder a su cuenta
           </p>
       </div>
       <div class="mb-3">
           <label for="loginEmail" class="form-label">
               Email 
           </label>
           <input type="email"
                  class="form-control form-control-lg rounded-3"
                  id="loginEmail"
                  placeholder="name@example.com">
       </div>
       <div class="mb-3">
           <div class="d-flex justify-content-between">
               <label for="loginPassword" class="form-label">
                   Password
               </label>
               <div class="text-end mb-3">
              <a href="#" class="text-decoration-none small text-primary" data-bs-toggle="modal" data-bs-target="#modalRecuperarPassword">
               ¿Olvidaste tu contraseña?
    
</div>
           </div>
           <input type="password"
                  class="form-control form-control-lg rounded-3"
                  id="loginPassword"
                  placeholder="••••••••">
       </div>
       <div class="form-check mb-4">
           <input class="form-check-input"
                  type="checkbox"
                  id="rememberMe">
           <label class="form-check-label" for="rememberMe">
               recuerdame
           </label>
       </div>
       <button type="submit"
               class="btn btn-info btn-lg w-100 rounded-3">
           Acceder
       </button>
       <button type="submit"
               class="btn btn-info btn-lg w-100 rounded-3 my-2">
                <i class="fab fa-google"></i>
       </button>
       <button type="submit"
               class="btn btn-info btn-lg w-100 rounded-3">
                <i class="fab fa-facebook"></i>
       </button>
       <div class="text-center mt-4">
           <span class="text-muted small"></span>
           <a href="#" class="small text-decoration-none">
               
           </a>
       </div>
   </form>">
   </div>
   
    <!---footer-->
<!-- Modal Recuperar Contraseña -->
<div class="modal fade" id="modalRecuperarPassword" tabindex="-1" aria-labelledby="modalRecuperarPasswordLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      
      <!-- Encabezado del modal con el color de BC-Viajes -->
      <div class="modal-header" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(7, 59, 145, 0.9)); color: white;">
        <h5 class="modal-title" id="modalRecuperarPasswordLabel">
            <i class="fas fa-key me-2"></i>Recuperar Contraseña
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <!-- Cuerpo del modal -->
      <div class="modal-body">
        <p class="text-muted mb-3">
            No te preocupes. Ingresa tu correo electrónico y te enviaremos un enlace seguro para restablecer tu contraseña.
        </p>
        <form id="formRecuperarPassword">
          <div class="mb-3">
            <label for="emailRecuperar" class="form-label fw-bold">Correo electrónico</label>
            <input type="email" class="form-control" id="emailRecuperar" placeholder="tu@email.com" required>
          </div>
        </form>
      </div>
      
      <!-- Pie del modal con los botones -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="formRecuperarPassword" class="btn btn-primary">Enviar enlace</button>
      </div>
      
    </div>
  </div>
</div>
